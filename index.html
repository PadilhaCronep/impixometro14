
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STF Inpixometer - Monitoramento Institucional</title>
    
    <!-- Metadados de Compartilhamento (Twitter Cards & Open Graph) -->
    <meta name="description" content="Plataforma de monitoramento de integridade institucional e percepção pública do STF.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@Aludydias">
    <meta name="twitter:title" content="STF Inpixômetro">
    <meta name="twitter:description" content="Eu votei no Inpixômetro, vote você também. Acompanhe a pressão institucional em tempo real.">
    <meta name="twitter:image" content="https://lh3.googleusercontent.com/d/1ld8LyI2YdeLhedyxFC45gH4bHkF-OwDE">
    <meta name="twitter:url" content="https://aludydias.com.br/">
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="STF Inpixômetro">
    <meta property="og:description" content="Plataforma interativa de monitoramento cívico. Participe do termômetro popular.">
    <meta property="og:image" content="https://lh3.googleusercontent.com/d/1ld8LyI2YdeLhedyxFC45gH4bHkF-OwDE">
    <meta property="og:url" content="https://aludydias.com.br/">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#F9CC18',
                        brandBlack: '#000000',
                        brandWhite: '#FFFFFF',
                        alertRed: '#EF4444',
                        stableGreen: '#22C55E',
                        warningYellow: '#FBBF24'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .grayscale-hover:hover {
            filter: grayscale(0%);
        }
        .grayscale-default {
            filter: grayscale(100%);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .mask-fade-edges {
            mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #111;
        }
        ::-webkit-scrollbar-thumb {
            background: #F9CC18;
            border-radius: 4px;
        }

        /* MOBILE-ONLY POLISH (STRICTLY < 1024px) */
        @media (max-width: 1023px) {
            .mobile-snap-x {
                scroll-snap-type: x mandatory;
                -webkit-overflow-scrolling: touch;
            }
            .mobile-snap-center {
                scroll-snap-align: center;
            }
            .transition-mobile {
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            button, a {
                min-height: 44px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .mobile-px {
                padding-left: 1.5rem;
                padding-right: 1.5rem;
            }
            h1 { line-height: 0.9 !important; letter-spacing: -0.05em !important; }
            .font-heading { letter-spacing: -0.02em; }
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;padding:24px;text-align:center;">
            <div>
                <h1 style="font-size:20px;margin-bottom:8px;">Carregando...</h1>
                <p style="font-size:14px;opacity:0.8;">Se esta mensagem persistir, verifique o console do navegador.</p>
            </div>
        </div>
    </div>
    <noscript>
        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;padding:24px;text-align:center;">
            <div>
                <h1 style="font-size:20px;margin-bottom:8px;">JavaScript desativado</h1>
                <p style="font-size:14px;opacity:0.8;">Ative o JavaScript para visualizar o aplicativo.</p>
            </div>
        </div>
    </noscript>
<script type="module" src="./index.tsx"></script>
<script>
    setTimeout(() => {
        if (!window.__APP_MOUNTED__) {
            const root = document.getElementById('root');
            if (root) {
                root.innerHTML = `
                  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;padding:24px;text-align:center;">
                    <div>
                      <h1 style="font-size:20px;margin-bottom:8px;">Falha ao carregar</h1>
                      <p style="font-size:14px;opacity:0.8;">O JavaScript não foi carregado. Verifique erros 404/MIME na aba Network.</p>
                    </div>
                  </div>
                `;
            }
        }
    }, 5000);
</script>
</body>
</html>
